<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Checkpoint · Meus jogos</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f8f7" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      // Applies theme and accent before first paint (see src/appearance/appearance.ts).
      (function () {
        var html = document.documentElement;
        var v = {};
        try {
          v = JSON.parse(localStorage.getItem('checkpoint:appearance:last') || '{}') || {};
        } catch (e) {}
        var dark =
          v.theme === 'dark' ||
          (v.theme !== 'light' &&
            window.matchMedia &&
            matchMedia('(prefers-color-scheme: dark)').matches);
        html.setAttribute('data-theme', dark ? 'dark' : 'light');
        if (/^(green|blue|violet|orange|rose)$/.test(v.accent))
          html.setAttribute('data-accent', v.accent);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', dark ? '#0e1412' : '#f6f8f7');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
