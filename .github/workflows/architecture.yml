name: Architecture integrity
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  deterministic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate every commit and final state
        env:
          REVIEW_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          REVIEW_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node AI/skills/branch-review/scripts/branch-review.mjs --deterministic-only --base "$REVIEW_BASE" --head "$REVIEW_HEAD"
      - run: npm run architecture:test
  semantic:
    if: vars.ARCHITECTURE_SEMANTIC_CI == 'enabled'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - name: Independent configured semantic review
        env:
          REVIEW_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          REVIEW_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          ARCHITECTURE_REVIEW_COMMAND: ${{ vars.ARCHITECTURE_REVIEW_COMMAND }}
        run: node AI/skills/branch-review/scripts/branch-review.mjs --base "$REVIEW_BASE" --head "$REVIEW_HEAD"
